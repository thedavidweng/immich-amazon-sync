[tools]
go = "1.27.3"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
jactionlint = "2.3.0"

[tasks.fmt]
run = "gofmt -w ."

[tasks.build]
run = "go build ./..."

[tasks.test]
run = "go test ./..."

[tasks.check]
description = "Read-only Go and workflow quality gate"
run = 'GOLANGCI_LINT="$(mise where go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint@2.15.0)/bin/golangci-lint" sh scripts/check.sh'

[tasks.smoke]
description = "Build and exercise both Linux container platforms without cloud access"
run = "sh scripts/smoke.sh"
