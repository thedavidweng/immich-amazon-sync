name: Publish OCI
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-oci
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          cache-binary: false
      - name: Publish new immutable version and commit tags
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for tag in "$VERSION" "sha-$COMMIT"; do
            if docker buildx imagetools inspect "$image:$tag" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
              echo "Refusing to overwrite existing tag: $tag" >&2
              exit 1
            fi
            if ! grep -Fq "$image:$tag: not found" "$RUNNER_TEMP/manifest-error" \
                && ! grep -Fq 'manifest unknown' "$RUNNER_TEMP/manifest-error"; then
              cat "$RUNNER_TEMP/manifest-error" >&2
              exit 1
            fi
          done
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" \
            --tag "$image:$VERSION" --tag "$image:sha-$COMMIT" .
